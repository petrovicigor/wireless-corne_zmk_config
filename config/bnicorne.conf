# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y

# BLE stability (2026-11-25): the left half dropped BLE to the Mac and the split
# link, also while on USB power, so it is radio, not battery.
# These live here because the build only merges config/bnicorne.conf. The old
# boards/arm/bnicorne/blecorne.conf was never picked up (the build's .config had
# CONFIG_BT_CTLR_PHY_2M=y despite it) and was removed on 2026-11-26.
# Max TX power for the nRF52840 (default 0 dBm). ZMK docs: recommended for
# unreliable connections, "power consumption difference is negligible".
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 1M PHY only: 2M has less range/robustness; ZMK docs list it as a pairing/connection fix.
CONFIG_BT_CTLR_PHY_2M=n
# Workaround for intermittent drops with "reason 0x24" (LMP PDU not allowed),
# seen in a USB log 2026-11-25. Zephyr ll_sw bug: after the Mac rejects our
# connection parameter request, a later LE Ping that overlaps a channel map
# update kills the link. Fixed upstream in zephyrproject-rtos/zephyr#123292
# (issue #123290), not in ZMK's v4.1.0+zmk-fixes yet. Drop this line once ZMK's
# Zephyr has that fix.
CONFIG_BT_CTLR_LE_PING=n
